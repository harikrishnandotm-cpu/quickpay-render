services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quickpay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickpay-local}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickpay -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.0.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  customer-service:
    build:
      context: ./backend
      args:
        SERVICE_MODULE: customer-service
    image: quickpay/customer-service:local
    environment: &db-env
      SERVICE_NAME: customer-service
      DB_HOST: postgres
      DB_NAME: customer_db
      DB_USER: quickpay
      DB_PASSWORD: ${POSTGRES_PASSWORD:-quickpay-local}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-deployment-123456}
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    healthcheck: &service-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  merchant-service:
    build:
      context: ./backend
      args:
        SERVICE_MODULE: merchant-service
    image: quickpay/merchant-service:local
    environment:
      <<: *db-env
      SERVICE_NAME: merchant-service
      DB_NAME: merchant_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    healthcheck: *service-healthcheck

  payment-service:
    build:
      context: ./backend
      args:
        SERVICE_MODULE: payment-service
    image: quickpay/payment-service:local
    environment:
      <<: *db-env
      SERVICE_NAME: payment-service
      DB_NAME: payment_db
      KAFKA_BOOTSTRAP: kafka:9092
      CUSTOMER_SERVICE_URL: http://customer-service:8080
      MERCHANT_SERVICE_URL: http://merchant-service:8080
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      customer-service: {condition: service_healthy}
      merchant-service: {condition: service_healthy}
    restart: unless-stopped
    healthcheck: *service-healthcheck

  transaction-service:
    build:
      context: ./backend
      args:
        SERVICE_MODULE: transaction-service
    image: quickpay/transaction-service:local
    environment:
      <<: *db-env
      SERVICE_NAME: transaction-service
      DB_NAME: transaction_db
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped
    healthcheck: *service-healthcheck

  notification-service:
    build:
      context: ./backend
      args:
        SERVICE_MODULE: notification-service
    image: quickpay/notification-service:local
    environment:
      <<: *db-env
      SERVICE_NAME: notification-service
      DB_NAME: notification_db
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped
    healthcheck: *service-healthcheck

  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE_MODULE: api-gateway
    image: quickpay/api-gateway:local
    environment:
      SERVICE_NAME: api-gateway
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-deployment-123456}
      CUSTOMER_SERVICE_URL: http://customer-service:8080
      MERCHANT_SERVICE_URL: http://merchant-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      TRANSACTION_SERVICE_URL: http://transaction-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    depends_on:
      postgres: {condition: service_healthy}
      customer-service: {condition: service_healthy}
      merchant-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      transaction-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
    ports:
      - "${GATEWAY_PORT:-8081}:8080"
    restart: unless-stopped
    healthcheck: *service-healthcheck

  frontend:
    build: ./frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres-data:
